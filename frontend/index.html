<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeadFlow CRM: capture leads, move them through your pipeline and never miss a follow-up." />
    <meta name="color-scheme" content="light dark" />
    <title>LeadFlow CRM</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong colours.
      try {
        var t = localStorage.getItem('leadflow.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
